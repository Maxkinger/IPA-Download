name: Build IDAPastel DMG

on:
  push:
    branches: [tv]
    tags: ['idapastel-v*']
  pull_request:
    branches: [tv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idapastel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version | tee xcode-version.txt
          grep -q '^Xcode 26\.' xcode-version.txt

      - name: Install Node dependencies
        run: npm ci --prefix NodeProject

      - name: Test Node engine
        run: npm test --prefix NodeProject

      - name: Test downloaded package platform restore
        run: |
          xcrun swiftc \
            -parse-as-library \
            -module-cache-path "$RUNNER_TEMP/idapastel-swift-module-cache" \
            Pastel/DownloadedPackagePlatform.swift \
            Tests/DownloadedPackagePlatformTests.swift \
            -o "$RUNNER_TEMP/DownloadedPackagePlatformTests"
          "$RUNNER_TEMP/DownloadedPackagePlatformTests"

      - name: Test Apple version request policy
        run: |
          xcrun swiftc \
            -parse-as-library \
            -module-cache-path "$RUNNER_TEMP/idapastel-swift-module-cache" \
            Pastel/AppleVersionIDsRequestPolicy.swift \
            Tests/AppleVersionIDsRequestPolicyTests.swift \
            -o "$RUNNER_TEMP/AppleVersionIDsRequestPolicyTests"
          "$RUNNER_TEMP/AppleVersionIDsRequestPolicyTests"

      - name: Test App Store platform availability
        run: |
          xcrun swiftc \
            -parse-as-library \
            -module-cache-path "$RUNNER_TEMP/idapastel-swift-module-cache" \
            Pastel/AppStorePlatformAvailability.swift \
            Tests/AppStorePlatformAvailabilityTests.swift \
            -o "$RUNNER_TEMP/AppStorePlatformAvailabilityTests"
          "$RUNNER_TEMP/AppStorePlatformAvailabilityTests"

      - name: Test workflow asset selection
        run: ruby Scripts/TestIDAPastelWorkflowAssets.rb

      - name: Build IDAPastel
        run: |
          xcodebuild -project Pastel.xcodeproj \
            -scheme IDAPastel \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Verify and package
        id: package
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/IDAPastel.app"
          Scripts/VerifyIDAPastelApp.sh "$app"
          Scripts/BuildIDAPastelDMG.sh "$app" dist
          shopt -s nullglob
          dmgs=(dist/IDAPastel-*-arm64.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          Scripts/VerifyIDAPastelDMG.sh "$dmg"
          bash Scripts/TestIDAPastelPackaging.sh "$app" "$dmg"
          checksum="$dmg.sha256"
          test -f "$checksum"
          printf 'dmg=%s\n' "$dmg" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: IDAPastel-arm64
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/idapastel-v')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$CHECKSUM_PATH" --generate-notes --title "IDAPastel $GITHUB_REF_NAME"
